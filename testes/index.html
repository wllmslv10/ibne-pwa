<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#123E70">
    <meta name="description" content="Instalador da versão de testes da Escala de Mídia IBNE.">
    <title>Instalar Escala de Mídia IBNE — Testes</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #123E70, #2475D8);
            color: #17304F;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 32px 24px;
            background: #FFFFFF;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .logo {
            display: block;
            width: 140px;
            height: 140px;
            margin: 0 auto 22px;
            object-fit: contain;
        }

        h1 {
            color: #123E70;
            font-size: 25px;
            line-height: 1.3;
            margin: 0 0 14px;
        }

        .descricao {
            font-size: 16px;
            line-height: 1.6;
            margin: 0 0 24px;
            color: #475569;
        }

        .botao {
            display: block;
            padding: 17px 14px;
            border-radius: 14px;
            background: #1557B0;
            color: #FFFFFF;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            line-height: 1.4;
            transition: background 0.2s, transform 0.2s;
        }

        .botao:hover {
            background: #0D438F;
            transform: translateY(-2px);
        }

        .rodape {
            margin-top: 24px;
            font-size: 12px;
            color: #64748B;
        }
    </style>
</head>

<body>
    <main class="container">
        <img
            class="logo"
            src="https://raw.githubusercontent.com/wllmslv10/ibne-pwa/pwa-setup/icons/icone-ibne-app-v3.svg"
            alt="Logotipo da Igreja Batista Nova Esperança"
        >

        <h1>Instalar Escala de Mídia IBNE — Testes</h1>

        <p class="descricao">
            Acesse com facilidade a versão de testes do aplicativo da equipe de mídia
            da Igreja Batista Nova Esperança.
        </p>

        <a
            class="botao"
            href="https://ibne-escala-midia-teste.streamlit.app/"
            target="_blank"
            rel="noopener noreferrer"
        >
            🔵 ABRIR ESCALA DE MÍDIA IBNE — TESTES
        </a>

        <div class="rodape">
            Igreja Batista Nova Esperança — IBNE · Ambiente de testes
        </div>
    </main>
</body>
</html>
